
<!DOCTYPE html>
<html>
<head>
  <title>Color Box Event Listener</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #222;
      color: white;
      padding-top: 50px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .box {
      width: 120px;
      height: 120px;
      cursor: pointer;
      border: 3px solid white;
      border-radius: 10px;
    }

    #box1 {
      background-color: red;
    }

    #box2 {
      background-color: blue;
    }

    #box3 {
      background-color: green;
    }

    #box4 {
      background-color: orange;
    }
  </style>
</head>

<body>

  <h2>Click a Box to Change Its Color</h2>

  <div class="container">

    <div class="box" id="box1"></div>

    <div class="box" id="box2"></div>

    <div class="box" id="box3"></div>

    <div class="box" id="box4"></div>

  </div>

  <script>

    // Function to generate random color
    function getRandomColor() {

      var letters = "0123456789ABCDEF";
      var color = "#";

      for (var i = 0; i < 6; i++) {
        color = color + letters[Math.floor(Math.random() * 16)];
      }

      return color;
    }


    // Get all four boxes
    var box1 = document.getElementById("box1");
    var box2 = document.getElementById("box2");
    var box3 = document.getElementById("box3");
    var box4 = document.getElementById("box4");


    // Add event listener to box 1
    box1.addEventListener("click", function() {
      box1.style.backgroundColor = getRandomColor();
    });


    // Add event listener to box 2
    box2.addEventListener("click", function() {
      box2.style.backgroundColor = getRandomColor();
    });


    // Add event listener to box 3
    box3.addEventListener("click", function() {
      box3.style.backgroundColor = getRandomColor();
    });


    // Add event listener to box 4
    box4.addEventListener("click", function() {
      box4.style.backgroundColor = getRandomColor();
    });

  </script>

</body>
</html>
